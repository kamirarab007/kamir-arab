<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Kamir Arab — Pencatatan</title>
<meta name="theme-color" content="#231E1A" />
<meta name="description" content="Aplikasi pencatatan produksi dan penjualan Kamir Arab" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kamir Arab" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg1:#362E28; --bg2:#231E1A; --bg3:#1C1815;
    --cream:#F5EFE3; --muted:#B8A98F; --faint:#8C7F6A;
    --brass:#B8873C; --brass-dark:#8C6428;
    --gold:#E8C547;
    --putih:#D9CBA3; --putih-dark:#9A8A5C;
    --pandan:#8FAE6B; --pandan-dark:#5C7A3F;
    --danger:#E88A6B;
    --card-bg:rgba(245,239,227,0.04);
    --card-bd:rgba(245,239,227,0.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'DM Sans',sans-serif;
    background:radial-gradient(circle at 20% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--card-bd);
    background:linear-gradient(180deg, rgba(184,135,60,0.14), transparent);
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header .stamp{flex-shrink:0;}
  header .titles{flex:1; min-width:0;}
  header input#shopName{
    background:none;border:none;color:var(--cream);
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;
    padding:0; width:100%; outline:none;
  }
  header .subtitle{font-size:11px;color:var(--muted);letter-spacing:.3px;margin-top:2px;}

  main{flex:1;overflow-y:auto;padding:16px 16px 100px;}

  nav#bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex; background:rgba(28,24,21,0.94); backdrop-filter:blur(8px);
    border-top:1px solid var(--card-bd);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:30;
  }
  nav#bottomnav button{
    flex:1; background:none; border:none; color:var(--faint);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; cursor:pointer; font-family:'DM Sans',sans-serif;
  }
  nav#bottomnav button.active{color:var(--gold);}
  nav#bottomnav button .ic{font-size:16px;}
  nav#bottomnav button .lb{font-size:10px;font-weight:600;}

  h2.section-title{
    font-family:'Fraunces',serif; font-size:15px; font-weight:600;
    color:#E8DFC9; margin:24px 0 12px;
  }
  h2.section-title:first-child{margin-top:0;}
  h2.section-title.sm{font-size:12.5px;color:var(--muted);margin:14px 0 8px;}

  .row{display:flex; gap:10px;}
  .field{flex:1;}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  input[type=date], input[type=number], input[type=text]{
    width:100%; background:rgba(245,239,227,0.05); border:1px solid rgba(245,239,227,0.14);
    border-radius:10px; padding:10px 12px; color:var(--cream); font-size:15px;
    font-family:'DM Sans',sans-serif; outline:none;
  }
  input[type=number]{font-family:'DM Mono',monospace;}

  .shift-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .shift-toggle button{
    flex:1; padding:12px 8px; border-radius:12px; cursor:pointer;
    font-weight:700; font-size:13.5px; font-family:'DM Sans',sans-serif;
    border:1px solid rgba(245,239,227,0.12); background:rgba(245,239,227,0.03); color:var(--muted);
  }
  .shift-toggle button.active{border-color:var(--brass); background:rgba(184,135,60,0.16); color:var(--gold);}
  .shift-toggle button .rng{display:block;font-size:10px;font-weight:500;opacity:.75;margin-top:2px;}

  /* --- adonan blocks: visually separated Putih vs Pandan --- */
  .adonan-block{
    border:1px solid var(--card-bd); border-radius:14px; padding:14px 14px 16px;
    margin-bottom:24px; background:rgba(245,239,227,0.02);
  }
  .adonan-block.putih{border-left:3px solid var(--putih);}
  .adonan-block.pandan{border-left:3px solid var(--pandan);}
  .adonan-block .blabel{
    font-family:'Fraunces',serif; font-weight:600; font-size:15px;
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .adonan-block .blabel .dot{width:11px;height:11px;border-radius:50%;}
  .target-line{font-size:12px;color:var(--faint);margin:10px 0 12px;padding:8px 10px;background:rgba(245,239,227,0.03);border-radius:8px;}
  .target-line b{color:var(--cream);}
  .target-line.match b.sum{color:#8FC97E;}
  .target-line.off b.sum{color:var(--gold);}

  .varian-row{
    display:flex; align-items:center; gap:12px; background:rgba(245,239,227,0.03);
    border:1px solid var(--card-bd); border-radius:12px; padding:10px 14px; margin-bottom:8px;
  }
  .varian-row .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .varian-row .lbl{flex:1;font-weight:600;font-size:13.5px;}
  .varian-row .lbl .price{display:block;font-size:10.5px;color:var(--faint);font-weight:500;margin-top:1px;}
  .varian-row input{width:70px; text-align:right; padding:8px 10px; font-size:14.5px;}

  .varian-pick{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .varian-pick button{
    display:flex; align-items:center; gap:8px; padding:10px 10px; border-radius:10px; cursor:pointer;
    border:1px solid rgba(245,239,227,0.12); background:rgba(245,239,227,0.03); color:var(--muted);
    font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:600; text-align:left;
  }
  .varian-pick button .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .varian-pick button.active{background:rgba(184,135,60,0.14);}

  button.primary{
    width:100%; padding:13px 16px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--brass), var(--brass-dark)); color:#1C1815;
    font-weight:700; font-size:14px; font-family:'DM Sans',sans-serif; letter-spacing:.2px;
  }
  button.primary:disabled{background:rgba(245,239,227,0.08); color:#6B6154; cursor:not-allowed;}
  button.wa{
    width:100%; padding:13px 16px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg, #4CAF50, #357A38); color:#fff;
    font-weight:700; font-size:14px; font-family:'DM Sans',sans-serif; display:flex; align-items:center;
    justify-content:center; gap:8px;
  }

  .stat-cards{display:flex; gap:10px; margin-bottom:20px;}
  .stat-card{
    flex:1; min-width:0; background:var(--card-bg); border:1px solid var(--card-bd);
    border-radius:14px; padding:13px 14px;
  }
  .stat-card .lb{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .stat-card .val{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1;}
  .stat-card .sub{font-size:10.5px;color:var(--faint);margin-top:4px;}

  .flavor-line{margin-bottom:15px;}
  .flavor-line .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .flavor-line .name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;}
  .flavor-line .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .flavor-line .nums{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);}
  .bar-bg{height:7px;background:rgba(245,239,227,0.08);border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;}
  .flavor-line .stock{font-size:11px;color:var(--faint);margin-top:4px;}

  .empty{
    border:1px dashed rgba(245,239,227,0.18); border-radius:14px; padding:26px 16px;
    text-align:center; color:var(--faint); font-size:13px;
  }

  .card{
    background:var(--card-bg); border:1px solid var(--card-bd); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; cursor:pointer;
  }
  .card .head{display:flex;justify-content:space-between;align-items:center;}
  .card .date{font-weight:700;font-size:14px;}
  .card .meta{font-size:11px;color:var(--faint);margin-top:2px;}
  .card .omzet{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);font-weight:600;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:448px;
    background:#3A2F18; border:1px solid var(--gold); color:var(--cream);
    padding:10px 14px; border-radius:10px; font-size:12.5px; text-align:center; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.error{background:#4A2A22;border-color:var(--danger);}

  .pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:.3px;}
  .pill.pagi{background:rgba(232,197,71,0.15); color:var(--gold);}
  .pill.sore{background:rgba(143,174,107,0.18); color:var(--pandan);}

  .month-card{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;}
  .month-card .mtitle{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-bottom:8px;}
  .month-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .month-grid .mstat{font-size:11px;color:var(--faint);}
  .month-grid .mstat b{display:block;color:var(--cream);font-family:'DM Mono',monospace;font-size:14px;font-weight:600;}

  .detail-back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:5px;padding:0;}

  select#waScope{
    width:100%; background:rgba(245,239,227,0.05); border:1px solid rgba(245,239,227,0.14);
    border-radius:10px; padding:10px 12px; color:var(--cream); font-size:14px; margin-bottom:14px;
  }

  /* ---- activity list: editable entries with +/-, edit, delete ---- */
  .activity-item{
    background:var(--card-bg); border:1px solid var(--card-bd); border-radius:12px;
    padding:11px 13px; margin-bottom:8px;
  }
  .activity-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .activity-item .lbl{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px;}
  .activity-item .lbl .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .activity-item .actions{display:flex;gap:2px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--faint);font-size:14px;padding:5px 7px;border-radius:6px;}
  .icon-btn:hover{background:rgba(245,239,227,0.06);}
  .icon-btn.danger{color:var(--danger);}
  .batch-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .batch-fields .bf{}
  .batch-fields label{font-size:9.5px;color:var(--faint);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  .batch-fields input{padding:7px 8px;font-size:13px;}
  .batch-kgtarget{display:flex;gap:8px;margin-top:2px;margin-bottom:2px;}
  .batch-kgtarget .bf{flex:1;}

  .qty-stepper{display:flex;align-items:center;gap:6px;}
  .qty-stepper button{
    width:26px;height:26px;border-radius:8px;border:1px solid rgba(245,239,227,0.16);
    background:rgba(245,239,227,0.05);color:var(--cream);font-size:15px;cursor:pointer;
    line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .qty-stepper input{width:48px;text-align:center;padding:5px 4px;font-size:13px;}
  .pay-badge{
    margin-top:8px; background:rgba(245,239,227,0.04); border:1px solid; border-radius:8px;
    padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif;
  }
  .payment-cards{display:flex;gap:8px;margin-bottom:20px;}
  .payment-card{
    flex:1; background:var(--card-bg); border:1px solid var(--card-bd); border-radius:12px;
    padding:11px 12px; text-align:center;
  }
  .payment-card .lb{font-size:10px;color:var(--muted);margin-bottom:5px;}
  .payment-card .val{font-family:'DM Mono',monospace;font-weight:600;font-size:13px;}

  /* ---- Kasir: cart & receipt ---- */
  .cart-item{
    display:flex; align-items:center; gap:10px; background:var(--card-bg);
    border:1px solid var(--card-bd); border-radius:12px; padding:10px 12px; margin-bottom:8px;
  }
  .cart-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .cart-item .info{flex:1;min-width:0;}
  .cart-item .info .nm{font-weight:600;font-size:13px;}
  .cart-item .info .sub{font-size:11px;color:var(--faint);margin-top:2px;}
  .cart-item .amt{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap;}
  .cart-item .rm{background:none;border:none;color:var(--danger);font-size:15px;cursor:pointer;padding:4px 6px;flex-shrink:0;}
  .cart-total-row{
    display:flex; justify-content:space-between; align-items:center; padding:14px 4px;
    border-top:1px dashed rgba(245,239,227,0.18); margin-top:6px; margin-bottom:16px;
  }
  .cart-total-row .lb{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
  .cart-total-row .val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--gold);}
  .change-box{
    background:rgba(143,201,126,0.08); border:1px solid rgba(143,201,126,0.3); border-radius:12px;
    padding:12px 14px; margin:14px 0; display:flex; justify-content:space-between; align-items:center;
  }
  .change-box.negative{background:rgba(232,138,107,0.08); border-color:rgba(232,138,107,0.3);}
  .change-box .lb{font-size:12.5px;color:var(--muted);}
  .change-box .val{font-family:'DM Mono',monospace;font-weight:700;font-size:16px;color:#8FC97E;}
  .change-box.negative .val{color:var(--danger);}

  .receipt-overlay{
    position:absolute; inset:0; background:rgba(20,17,15,0.92); z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:20px 16px; overflow-y:auto;
  }
  .receipt-overlay img{max-width:100%; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.5); margin-bottom:18px;}
  .receipt-actions{display:flex; gap:10px; width:100%; max-width:340px;}
  .receipt-actions button{flex:1;}
  .receipt-close{
    background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
    margin-top:16px; text-decoration:underline;
  }
  .tx-card{
    background:var(--card-bg); border:1px solid var(--card-bd); border-radius:12px;
    padding:11px 13px; margin-bottom:8px;
  }
  .tx-card .top{display:flex;justify-content:space-between;align-items:center;}
  .tx-card .no{font-family:'DM Mono',monospace;font-size:11px;color:var(--faint);}
  .tx-card .total{font-weight:700;font-size:14px;color:var(--gold);}
  .tx-card .items{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .tx-card .actions{display:flex;gap:6px;margin-top:8px;}
  .tx-card .actions button{
    flex:1; padding:6px 8px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer;
    border:1px solid rgba(245,239,227,0.14); background:rgba(245,239,227,0.03); color:var(--muted);
  }
</style>
</head>
<body>
<div id="shell">
  <header>
    <img class="stamp" src="logo-header.png" width="34" height="34" style="border-radius:50%;object-fit:cover;flex-shrink:0;" alt="Kamir Arab" />
    <div class="titles">
      <div style="display:flex;align-items:baseline;gap:6px;">
        <input id="shopName" maxlength="28" style="flex:1;min-width:0;" />
        <span style="font-size:9px;color:var(--faint);font-weight:600;letter-spacing:.3px;flex-shrink:0;">v1.3</span>
        <span id="syncStatus" style="font-size:9px;color:var(--faint);font-weight:600;flex-shrink:0;">●</span>
      </div>
      <div class="subtitle" id="headerSubtitle">Pencatatan produksi & penjualan</div>
    </div>
    <button id="btnOpenPriceSettings" style="background:none;border:none;color:var(--faint);font-size:19px;cursor:pointer;padding:6px;flex-shrink:0;" title="Pengaturan Harga">⚙️</button>
  </header>

  <main id="app"></main>

  <nav id="bottomnav">
    <button data-tab="input"><span class="ic">＋</span><span class="lb">Input</span></button>
    <button data-tab="kasir"><span class="ic">🧾</span><span class="lb">Kasir</span></button>
    <button data-tab="ringkasan"><span class="ic">◎</span><span class="lb">Ringkasan</span></button>
    <button data-tab="riwayat"><span class="ic">☰</span><span class="lb">Riwayat</span></button>
    <button data-tab="bulanan"><span class="ic">▤</span><span class="lb">Bulanan</span></button>
  </nav>
</div>

<script type="module">
/* ================= FIREBASE (real-time sync) ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPfWUVxoe1xwXdxRg4Yii7eDH59ELKVAc",
  authDomain: "kamir-arab.firebaseapp.com",
  projectId: "kamir-arab",
  storageBucket: "kamir-arab.firebasestorage.app",
  messagingSenderId: "892428901247",
  appId: "1:892428901247:web:c22fc1541659b730f8d84a"
};

let cloudReady = false;
let db = null;
try{
  const fbApp = initializeApp(firebaseConfig);
  db = getFirestore(fbApp);
  cloudReady = true;
}catch(e){
  console.warn('Firebase gagal diinisialisasi, app tetap jalan lokal saja.', e);
}

window.addEventListener('DOMContentLoaded', ()=>{
  const statusEl = document.getElementById('syncStatus');
  if(statusEl && !cloudReady){
    statusEl.textContent = '○';
    statusEl.title = 'Mode lokal saja (cloud tidak aktif)';
  }
});

const COL_BATCHES = 'kamir_batches';
const COL_SALES = 'kamir_sales';
const COL_TX = 'kamir_transactions';
const SETTINGS_DOC = 'kamir_settings/main';

// semua fungsi push ke cloud "fire and forget" — kalau gagal (offline dll), data lokal tetap aman
function cloudSetBatch(id, data){ if(!cloudReady) return; setDoc(doc(db, COL_BATCHES, id), data).catch(()=>{}); }
function cloudUpdateBatch(id, patch){ if(!cloudReady) return; updateDoc(doc(db, COL_BATCHES, id), patch).catch(()=>{}); }
function cloudDeleteBatch(id){ if(!cloudReady) return; deleteDoc(doc(db, COL_BATCHES, id)).catch(()=>{}); }
function cloudSetSale(id, data){ if(!cloudReady) return; setDoc(doc(db, COL_SALES, id), data).catch(()=>{}); }
function cloudUpdateSale(id, patch){ if(!cloudReady) return; updateDoc(doc(db, COL_SALES, id), patch).catch(()=>{}); }
function cloudDeleteSale(id){ if(!cloudReady) return; deleteDoc(doc(db, COL_SALES, id)).catch(()=>{}); }
function cloudSetTx(id, data){ if(!cloudReady) return; setDoc(doc(db, COL_TX, id), data).catch(()=>{}); }
function cloudDeleteTx(id){ if(!cloudReady) return; deleteDoc(doc(db, COL_TX, id)).catch(()=>{}); }
function cloudSetSettings(data){ if(!cloudReady) return; setDoc(doc(db, SETTINGS_DOC), data, {merge:true}).catch(()=>{}); }

/* ================= DATA & CONFIG ================= */
const STORAGE_KEY = 'kamirData_v2';
const OLD_STORAGE_KEY = 'kamirData_v1';
const WA_NUMBER = '628121640208';
const KAMIR_PER_KG = 35; // default patokan, bisa diubah manual per adonan

const RASA = [
  {key:'original', label:'Original'},
  {key:'keju', label:'Keju'},
  {key:'coklat', label:'Coklat'},
];

const DASAR = {
  putih:  {label:'Putih',  color:'#D9CBA3'},
  pandan: {label:'Pandan', color:'#8FAE6B'},
};

// varian = dasar_rasa, used for stock/report breakdown & pricing
const LOGO_DATA_URL = "logo-header.png";

const VARIAN = [

  {key:'putih_keju',     dasar:'putih', rasa:'Keju',     harga:5000, color:'#E8C547'},

const PAYMENTS = {

  tf:   {label:'Transfer', color:'#7EA8D9'},
  qris: {label:'QRIS', color:'#D98FC9'},
};
function paymentKey(p){ return (p==='tf'||p==='qris') ? p : 'cash'; }

function emptyDay(){ return { pagi:{batches:[],sales:[],transactions:[]}, sore:{batches:[],sales:[],transactions:[]} }; }
function ensureShiftArrays(shiftData){
  if(!shiftData.batches) shiftData.batches = [];
  if(!shiftData.sales) shiftData.sales = [];
  if(!shiftData.transactions) shiftData.transactions = [];
  return shiftData;
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
    // migrate from v1 shape if present (old batches had 6 flat varian keys, no dasar split)
    const old = localStorage.getItem(OLD_STORAGE_KEY);
    if(old){
      const parsed = JSON.parse(old);
      const migrated = {shopName: parsed.shopName || 'Kamir Arab', days:{}, monthly: parsed.monthly || {}};
      Object.keys(parsed.days||{}).forEach(dateStr=>{
        migrated.days[dateStr] = emptyDay();
        ['pagi','sore'].forEach(sh=>{
          const src = parsed.days[dateStr][sh] || {batches:[],sales:[]};
          (src.batches||[]).forEach(b=>{
            ['putih','pandan'].forEach(dasar=>{
              const o = Number(b[dasar+'_original'])||0, k = Number(b[dasar+'_keju'])||0, c = Number(b[dasar+'_coklat'])||0;
              if(o||k||c){
                migrated.days[dateStr][sh].batches.push({id:uid(), time:b.time, dasar, kg:0, target:o+k+c, original:o, keju:k, coklat:c});
              }
            });
          });
          migrated.days[dateStr][sh].sales = src.sales || [];
        });
      });
      return migrated;
    }
  }catch(e){}
  return {shopName:'Kamir Arab', days:{}, monthly:{}};
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast('Gagal menyimpan data di HP ini.', true); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let state = loadData();
if(!state.shopName) state.shopName = 'Kamir Arab';
if(typeof state.employeeName !== 'string') state.employeeName = '';
if(!state.days) state.days = {};
if(!state.monthly) state.monthly = {};
if(!state.prices){
  state.prices = {};
  VARIAN.forEach(v=> state.prices[v.key] = v.harga);
}
// isi harga varian baru (kalau ada) yang belum punya harga tersimpan
VARIAN.forEach(v=>{ if(typeof state.prices[v.key] !== 'number') state.prices[v.key] = v.harga; });

function getHarga(key){
  return (state.prices && typeof state.prices[key]==='number') ? state.prices[key] : varianByKey(key).harga;
}

/* ============== 30-day retention -> monthly archive ============== */
function archiveOldDays(){
  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate()-30);
  let changed = false;
  Object.keys(state.days).forEach(dateStr=>{
    const d = new Date(dateStr+'T00:00:00');
    if(d < cutoff){
      const monthKey = dateStr.slice(0,7);
      if(!state.monthly[monthKey]){
        state.monthly[monthKey] = {perVarian:{}, revenue:0, batchCount:0, dayCount:0, paymentTotals:{cash:0,tf:0,qris:0}};
        VARIAN.forEach(v=> state.monthly[monthKey].perVarian[v.key] = {printed:0, sold:0, revenue:0});
      }
      const m = state.monthly[monthKey];
      if(!m.paymentTotals) m.paymentTotals = {cash:0,tf:0,qris:0};
      const totals = computeDayTotals(dateStr);
      VARIAN.forEach(v=>{
        if(!m.perVarian[v.key].revenue) m.perVarian[v.key].revenue = 0;
        m.perVarian[v.key].printed += totals.perVarian[v.key].printed;
        m.perVarian[v.key].sold += totals.perVarian[v.key].sold;
        m.perVarian[v.key].revenue += totals.perVarian[v.key].revenue;
      });
      m.revenue += totals.revenue;
      m.batchCount += totals.batchCount;
      m.dayCount += 1;
      m.paymentTotals.cash += totals.paymentTotals.cash;
      m.paymentTotals.tf += totals.paymentTotals.tf;
      m.paymentTotals.qris += totals.paymentTotals.qris;

      // hapus juga entri hari itu dari cloud (Firestore), biar collection tetap ramping
      ['pagi','sore'].forEach(sh=>{
        const shData = state.days[dateStr][sh] || {batches:[],sales:[],transactions:[]};
        (shData.batches||[]).forEach(b=> cloudDeleteBatch(b.id));
        (shData.sales||[]).forEach(s=> cloudDeleteSale(s.id));
        (shData.transactions||[]).forEach(t=> cloudDeleteTx(t.id));
      });

      delete state.days[dateStr];
      changed = true;
    }
  });
  if(changed) saveData();
}

/* ================= HELPERS ================= */
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function fmtRp(n){ return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
function currentHourShift(){
  const h = new Date().getHours();
  if(h>=7 && h<13) return 'pagi';
  return 'sore';
}
function showToast(msg, isError){
  const t = document.createElement('div');
  t.className = 'toast'+(isError?' error':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2400);
}

function computeDayTotals(dateStr){
  const day = state.days[dateStr] || emptyDay();
  const perVarian = {};
  let revenue=0, batchCount=0, totalPrinted=0, totalSold=0;
  const paymentTotals = {cash:0, tf:0, qris:0};
  VARIAN.forEach(v=> perVarian[v.key] = {printed:0, sold:0, revenue:0});
  ['pagi','sore'].forEach(sh=>{
    const s = day[sh] || {batches:[],sales:[]};
    (s.batches||[]).forEach(b=>{
      batchCount++;
      RASA.forEach(r=>{ perVarian[b.dasar+'_'+r.key].printed += Number(b[r.key])||0; });
    });
    (s.sales||[]).forEach(sale=>{
      const harga = (typeof sale.harga === 'number') ? sale.harga : getHarga(sale.varian);
      const amt = (Number(sale.qty)||0) * harga;
      perVarian[sale.varian].sold += Number(sale.qty)||0;
      perVarian[sale.varian].revenue += amt;
      revenue += amt;
      paymentTotals[paymentKey(sale.payment)] += amt;
    });
  });
  VARIAN.forEach(v=>{ totalPrinted+=perVarian[v.key].printed; totalSold+=perVarian[v.key].sold; });
  return {perVarian, revenue, batchCount, totalPrinted, totalSold, paymentTotals};
}

function computeShiftTotals(dateStr, shift){
  const day = state.days[dateStr] || emptyDay();
  const s = day[shift] || {batches:[],sales:[]};
  const perVarian = {};
  let revenue=0, totalPrinted=0, totalSold=0, kgPutih=0, kgPandan=0;
  const paymentTotals = {cash:0, tf:0, qris:0};
  VARIAN.forEach(v=> perVarian[v.key] = {printed:0, sold:0, revenue:0});
  (s.batches||[]).forEach(b=>{
    if(b.dasar==='putih') kgPutih += Number(b.kg)||0; else kgPandan += Number(b.kg)||0;
    RASA.forEach(r=>{ perVarian[b.dasar+'_'+r.key].printed += Number(b[r.key])||0; });
  });
  (s.sales||[]).forEach(sale=>{
    const harga = (typeof sale.harga === 'number') ? sale.harga : getHarga(sale.varian);
    const amt = (Number(sale.qty)||0) * harga;
    perVarian[sale.varian].sold += Number(sale.qty)||0;
    perVarian[sale.varian].revenue += amt;
    revenue += amt;
    paymentTotals[paymentKey(sale.payment)] += amt;
  });
  VARIAN.forEach(v=>{ totalPrinted+=perVarian[v.key].printed; totalSold+=perVarian[v.key].sold; });
  return {perVarian, revenue, totalPrinted, totalSold, kgPutih, kgPandan, paymentTotals};
}

function ensureDay(dateStr){
  if(!state.days[dateStr]) state.days[dateStr] = emptyDay();
  ensureShiftArrays(state.days[dateStr].pagi);
  ensureShiftArrays(state.days[dateStr].sore);
}

function setupAdonanBlockLogic(dasar){
  const kgInput = document.getElementById('kg_'+dasar);
  const targetInput = document.getElementById('target_'+dasar);
  const line = document.getElementById('targetline_'+dasar);
  const rasaInputs = RASA.map(r=> document.getElementById('rasa_'+dasar+'_'+r.key));

  function updateLine(){
    const target = Number(targetInput.value)||0;
    const sum = rasaInputs.reduce((s,i)=> s+(Number(i.value)||0), 0);
    if(target<=0){
      line.className = 'target-line';
      line.innerHTML = 'Isi berat adonan — target otomatis '+KAMIR_PER_KG+'/kg (bisa diubah manual).';
    } else {
      const match = sum===target;
      line.className = 'target-line '+(match?'match':'off');
      line.innerHTML = 'Sudah diisi <b class="sum">'+sum+'</b> dari target <b>'+target+'</b> kamir'+(match?' — pas ✓':'')+ ' <span style="opacity:.7">(boleh tidak pas, hanya panduan)</span>';
    }
  }
  kgInput.addEventListener('input', ()=>{
    const kg = Number(kgInput.value)||0;
    targetInput.value = kg>0 ? Math.round(kg*KAMIR_PER_KG) : '';
    updateLine();
  });
  targetInput.addEventListener('input', updateLine);
  rasaInputs.forEach(i=> i.addEventListener('input', updateLine));

  document.getElementById('btnSave_'+dasar).addEventListener('click', ()=>{
    const kg = Number(kgInput.value)||0;
    const target = Number(targetInput.value)||0;
    const rasaVals = {};
    let sum = 0;
    RASA.forEach(r=>{
      const v = Number(document.getElementById('rasa_'+dasar+'_'+r.key).value)||0;
      rasaVals[r.key] = v; sum += v;
    });
    if(sum<=0){ showToast('Isi jumlah kamir yang dicetak untuk adonan '+DASAR[dasar].label+'.', true); return; }
    ensureDay(ui.inputDate);
    const batch = {id:uid(), time:new Date().toISOString(), dasar, kg, target, oleh: state.employeeName||'', ...rasaVals};
    state.days[ui.inputDate][ui.inputShift].batches.push(batch);
    saveData();
    cloudSetBatch(batch.id, {...batch, dateStr: ui.inputDate, shift: ui.inputShift});
    showToast('Adonan '+DASAR[dasar].label+' tersimpan · '+sum+' kamir dicetak');
    render();
  });
}

      saveData(); cloudDeleteBatch(id); showToast('Entri adonan dihapus'); render();
    });
  });
}

function renderFlavorLines(totals, showRevenue){
  if(totals.totalPrinted===0){
    return `<div class="empty">Belum ada data untuk tanggal ini.</div>`;
  }
  return VARIAN.map(v=>{
    const t = totals.perVarian[v.key];
    const stock = Math.max(t.printed - t.sold, 0);
    const pct = t.printed>0 ? Math.min((t.sold/t.printed)*100,100) : 0;
    return `
      <div class="flavor-line">
        <div class="top">
          <span class="name"><span class="dot" style="background:${v.color}"></span>${DASAR[v.dasar].label} ${v.rasa}</span>
          <span class="nums">${t.sold}/${t.printed} terjual</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${v.color}aa,${v.color})"></div></div>
        <div class="stock">Sisa: <b style="color:${v.color}">${stock}</b> kamir${showRevenue? ' · '+fmtRp(t.revenue):''}</div>
      </div>
    `;
  }).join('');
}

function renderTxList(transactions){
  const el = document.getElementById('txList');
  const sorted = [...transactions].sort((a,b)=> a.time<b.time?1:-1);
  el.innerHTML = sorted.map(tx=>{
    const itemsText = tx.items.map(it=> `${it.qty}× ${DASAR[varianByKey(it.varian).dasar].label} ${varianByKey(it.varian).rasa}`).join(', ');
    return `
      <div class="tx-card" data-txid="${tx.id}">
        <div class="top">
          <span class="no">${tx.receiptNo}${tx.buyerName? ' · '+tx.buyerName:''}</span>
          <span class="total">${fmtRp(tx.total)}</span>
        </div>
        <div class="items">${itemsText}</div>
        <div class="actions">
          <button data-reprint="${tx.id}">🧾 Lihat Struk</button>
          <button data-deltx="${tx.id}" style="color:var(--danger);border-color:rgba(232,138,107,0.3);">Hapus</button>
        </div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('[data-reprint]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tx = transactions.find(t=>t.id===btn.dataset.reprint);
      if(tx) await showReceiptFor(tx);
    });
  });
  el.querySelectorAll('[data-deltx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('Hapus transaksi ini? Penjualan terkait juga akan dihapus dari stok.')) return;
      const id = btn.dataset.deltx;
      const shiftData = state.days[ui.inputDate][ui.inputShift];
      const relatedSaleIds = shiftData.sales.filter(s=> s.txId===id).map(s=>s.id);
      shiftData.transactions = shiftData.transactions.filter(t=>t.id!==id);
      shiftData.sales = shiftData.sales.filter(s=> s.txId!==id);
      saveData();
      cloudDeleteTx(id);
      relatedSaleIds.forEach(sid=> cloudDeleteSale(sid));
      showToast('Transaksi dihapus'); render();
    });
  });
}

async function finalizeTransaction(withReceipt){
  if(ui.cart.length===0) return;
  ensureDay(ui.inputDate);
  const shiftData = state.days[ui.inputDate][ui.inputShift];

  const total = ui.cart.reduce((s,it)=> s + it.qty * getHarga(it.varian), 0);
  const cashGivenNum = Number(ui.cashGiven)||0;
  const change = ui.kasirPayment==='cash' ? (cashGivenNum - total) : 0;

  const seq = shiftData.transactions.length + 1;
  const receiptNo = `${ui.inputDate.replace(/-/g,'')}-${ui.inputShift.toUpperCase()}-${String(seq).padStart(3,'0')}`;

  const tx = {
    id: uid(),
    time: new Date().toISOString(),
    receiptNo,
    buyerName: ui.buyerName||'',
    items: ui.cart.map(it=>({varian:it.varian, qty:it.qty, harga:getHarga(it.varian)})),
    total,
    payment: ui.kasirPayment,
    cashGiven: ui.kasirPayment==='cash' ? cashGivenNum : null,
    change: ui.kasirPayment==='cash' ? change : null,
    employee: state.employeeName||'',
  };

  shiftData.transactions.push(tx);
  cloudSetTx(tx.id, {...tx, dateStr: ui.inputDate, shift: ui.inputShift});
  ui.cart.forEach(it=>{
    const saleEntry = {
      id: uid(), time: tx.time, varian: it.varian, qty: it.qty, harga: getHarga(it.varian),
      payment: ui.kasirPayment, oleh: state.employeeName||'', txId: tx.id,
    };
    shiftData.sales.push(saleEntry);
    cloudSetSale(saleEntry.id, {...saleEntry, dateStr: ui.inputDate, shift: ui.inputShift});
  });
  saveData();

  // reset cart for next transaction
  ui.cart = []; ui.cashGiven = ''; ui.buyerName = ''; ui.kasirPayment = 'cash';

  if(withReceipt){
    await showReceiptFor(tx);
  } else {
    showToast('Transaksi tersimpan · '+receiptNo);
    render();
  }
}

async function showReceiptFor(tx){
  try{
    const canvas = await buildReceiptCanvas(tx);
    const dataUrl = canvas.toDataURL('image/png');
    ui.receiptView = {tx, dataUrl};
    render();
  }catch(e){
    showToast('Gagal membuat struk.', true);
    render();
  }
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function buildReceiptCanvas(tx){
  const W = 400;
  const padX = 26;
  const lineH = 22;
  let logo = null;
  try{ logo = await loadImage(LOGO_DATA_URL); }catch(e){}

  const headerH = logo ? 132 : 90;
  const itemsH = tx.items.length * lineH;
  const extraLines = tx.payment==='cash' ? 3 : 1;
  const H = headerH + 46 + itemsH + 40 + (extraLines*20) + 90;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0,0,W,H);

  let y = 24;
  if(logo){
    const logoSize = 56;
    ctx.save();
    ctx.beginPath();
    ctx.arc(W/2, y+logoSize/2, logoSize/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(logo, W/2-logoSize/2, y, logoSize, logoSize);
    ctx.restore();
    y += logoSize + 12;
  }

  ctx.fillStyle = '#1C1815';
  ctx.textAlign = 'center';
  ctx.font = '700 18px Georgia, serif';
  ctx.fillText((state.shopName||'Kamir Arab').toUpperCase(), W/2, y);
  y += 20;
  ctx.font = '400 11px monospace';
  ctx.fillStyle = '#6B6154';
  ctx.fillText('Struk Pembelian', W/2, y);
  y += 22;

  ctx.strokeStyle = '#CBBFA8';
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padX,y); ctx.lineTo(W-padX,y); ctx.stroke();
  ctx.setLineDash([]);
  y += 20;

  ctx.textAlign = 'left';
  ctx.font = '400 11px monospace';
  ctx.fillStyle = '#3A332C';
  const dt = new Date(tx.time);
  const dateLabel = dt.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) + ' ' + dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  ctx.fillText(dateLabel, padX, y);
  ctx.textAlign = 'right';
  ctx.fillText(tx.receiptNo, W-padX, y);
  y += 16;
  ctx.textAlign = 'left';
  if(tx.buyerName){ ctx.fillText('Pembeli: '+tx.buyerName, padX, y); y += 16; }
  if(tx.employee){ ctx.fillText('Kasir: '+tx.employee, padX, y); y += 16; }
  y += 6;

  ctx.strokeStyle = '#CBBFA8';
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padX,y); ctx.lineTo(W-padX,y); ctx.stroke();
  ctx.setLineDash([]);
  y += 22;

  ctx.font = '400 12px monospace';
  tx.items.forEach(it=>{
    const v = varianByKey(it.varian);
    const name = `${DASAR[v.dasar].label} ${v.rasa}`;
    const subtotal = it.qty * it.harga;
    ctx.fillStyle = '#1C1815';
    ctx.textAlign = 'left';
    ctx.fillText(name, padX, y);
    ctx.textAlign = 'right';
    ctx.fillText(fmtRp(subtotal), W-padX, y);
    y += 14;
    ctx.fillStyle = '#8C7F6A';
    ctx.font = '400 10.5px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`${it.qty} x ${fmtRp(it.harga)}`, padX, y);
    ctx.font = '400 12px monospace';
    y += lineH - 14;
  });

  y += 8;
  ctx.strokeStyle = '#CBBFA8';
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padX,y); ctx.lineTo(W-padX,y); ctx.stroke();
  ctx.setLineDash([]);
  y += 24;

  ctx.font = '700 15px monospace';
  ctx.fillStyle = '#1C1815';
  ctx.textAlign = 'left';
  ctx.fillText('TOTAL', padX, y);
  ctx.textAlign = 'right';
  ctx.fillText(fmtRp(tx.total), W-padX, y);
  y += 24;

  ctx.font = '400 12px monospace';
  ctx.fillStyle = '#3A332C';
  ctx.textAlign = 'left';
  ctx.fillText('Bayar ('+PAYMENTS[paymentKey(tx.payment)].label+')', padX, y);
  ctx.textAlign = 'right';
  ctx.fillText(tx.payment==='cash' ? fmtRp(tx.cashGiven||0) : fmtRp(tx.total), W-padX, y);
  y += 18;

  if(tx.payment==='cash'){
    ctx.textAlign = 'left';
    ctx.fillText(tx.change<0 ? 'Kurang bayar' : 'Kembalian', padX, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = tx.change<0 ? '#C2503A' : '#3A332C';
    ctx.fillText(fmtRp(Math.abs(tx.change||0)), W-padX, y);
    y += 22;
  }

  y += 14;
  ctx.textAlign = 'center';
  ctx.font = 'italic 11px Georgia, serif';
  ctx.fillStyle = '#8C7F6A';
  ctx.fillText('Terima kasih sudah membeli Kamir Arab :)', W/2, y);

  return canvas;
}

function sendWhatsAppReport(dateStr, scope){
  let text = `*${state.shopName}*\nLaporan ${fmtDate(dateStr)}\n`;
  const buildBlock = (title, t)=>{
    let s = `\n*${title}*\n`;
    let any=false;
    VARIAN.forEach(v=>{
      const d = t.perVarian[v.key];
      if(d.printed>0 || d.sold>0){
        any=true;
        s += `${DASAR[v.dasar].label} ${v.rasa}: cetak ${d.printed}, terjual ${d.sold}\n`;
      }
    });
    if(!any) s += '(tidak ada data)\n';
    s += `Omzet: ${fmtRp(t.revenue)}\n`;
    s += `Cash: ${fmtRp(t.paymentTotals.cash)} · TF: ${fmtRp(t.paymentTotals.tf)} · QRIS: ${fmtRp(t.paymentTotals.qris)}\n`;
    return s;
  };

  if(scope==='all'){
    const totals = computeDayTotals(dateStr);
    text += buildBlock('Total Hari Ini', totals);
  } else {
    const t = computeShiftTotals(dateStr, scope);
    text += buildBlock('Shift '+SHIFTS[scope].label, t);
  }
  text += `\nDikirim dari aplikasi pencatatan Kamir.`;

  const url = 'https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(text);
  window.open(url, '_blank');
}

function currentMonthLiveTotals(){
  const monthKey = todayStr().slice(0,7);
  const perVarian = {}; VARIAN.forEach(v=> perVarian[v.key]={printed:0,sold:0,revenue:0});
  let revenue=0, batchCount=0, dayCount=0;
  const paymentTotals = {cash:0, tf:0, qris:0};
  Object.keys(state.days).forEach(dateStr=>{
    if(dateStr.slice(0,7)!==monthKey) return;
    const t = computeDayTotals(dateStr);
    VARIAN.forEach(v=>{ perVarian[v.key].printed+=t.perVarian[v.key].printed; perVarian[v.key].sold+=t.perVarian[v.key].sold; perVarian[v.key].revenue+=t.perVarian[v.key].revenue; });
    revenue += t.revenue; batchCount += t.batchCount; dayCount++;
    paymentTotals.cash += t.paymentTotals.cash; paymentTotals.tf += t.paymentTotals.tf; paymentTotals.qris += t.paymentTotals.qris;
  });
  return {monthKey, perVarian, revenue, batchCount, dayCount, paymentTotals};
}

function monthName(monthKey){
  const [y,m] = monthKey.split('-');
  const d = new Date(Number(y), Number(m)-1, 1);
  return d.toLocaleDateString('id-ID',{month:'long', year:'numeric'});
}

          <span class="omzet">${fmtRp(live.revenue)}</span>
        </div>

          <div class="mstat">Dicetak<b>${VARIAN.reduce((s,v)=>s+live.perVarian[v.key].printed,0)}</b></div>
          <div class="mstat">Terjual<b>${VARIAN.reduce((s,v)=>s+live.perVarian[v.key].sold,0)}</b></div>
          <div class="mstat">Adonan<b>${live.batchCount}</b></div>
        </div>
      </div>

  }
  archivedKeys.forEach(mk=>{
    const m = state.monthly[mk];
    html += `
      <div class="month-card" data-month="${mk}">
        <div class="head" style="display:flex;justify-content:space-between;align-items:center;">
          <span class="mtitle">${monthName(mk)}</span>

  app.innerHTML = html || `<div class="empty">Belum ada rekap bulanan. Rekap otomatis terbentuk setelah data harian berumur lebih dari 30 hari.</div>`;

  document.querySelectorAll('.month-card').forEach(c=>{
    c.addEventListener('click', ()=>{ ui.bulananDetail = c.dataset.month; render(); });
  });
}

/* ================= CLOUD SYNC (real-time listeners) ================= */
function mergeEntityChange(change, dateStr, shift, arrGetter){
  const data = change.doc.data();
  const id = change.doc.id;
  if(!dateStr || !shift) return false;
  ensureDay(dateStr);
  const arr = arrGetter(state.days[dateStr][shift]);
  const idx = arr.findIndex(x=>x.id===id);
  if(change.type==='removed'){
    if(idx>=0){ arr.splice(idx,1); return true; }
    return false;
  }
  const {dateStr:_d, shift:_s, ...rest} = data;
  const entry = {id, ...rest};
  if(idx>=0) arr[idx] = entry; else arr.push(entry);
  return true;
}

function initCloudSync(){
  if(!cloudReady) return;

  // Pengaturan bersama (nama toko & harga) — berlaku untuk semua HP
  onSnapshot(doc(db, SETTINGS_DOC), (snap)=>{
    const statusEl = document.getElementById('syncStatus');
    if(statusEl){
      const online = !snap.metadata.fromCache;
      statusEl.textContent = online ? '☁️' : '○';
      statusEl.title = online ? 'Tersambung — data real-time' : 'Offline — pakai data lokal';
      statusEl.style.color = online ? '#8FC97E' : 'var(--faint)';
    }
    if(!snap.exists()){
      // belum ada data di cloud sama sekali -> seed dari data lokal saat ini
      cloudSetSettings({shopName: state.shopName, prices: state.prices});
      return;
    }
    const data = snap.data();
    let changedLocal = false;
    if(data.shopName && data.shopName !== state.shopName){
      state.shopName = data.shopName;
      const shopInput = document.getElementById('shopName');
      if(shopInput && document.activeElement !== shopInput) shopInput.value = state.shopName;
      changedLocal = true;
    }
    if(data.prices){
      Object.keys(data.prices).forEach(k=>{ if(state.prices[k]!==data.prices[k]){ state.prices[k]=data.prices[k]; changedLocal=true; } });
    }
    if(changedLocal){ saveData(); render(); }
  }, ()=>{});

  onSnapshot(collection(db, COL_BATCHES), (snapshot)=>{
    let changedAny = false;
    snapshot.docChanges().forEach(change=>{
      const data = change.doc.data();
      if(mergeEntityChange(change, data.dateStr, data.shift, sh=>sh.batches)) changedAny = true;
    });
    if(changedAny){ saveData(); render(); }
  }, ()=>{});

  onSnapshot(collection(db, COL_SALES), (snapshot)=>{
    let changedAny = false;
    snapshot.docChanges().forEach(change=>{
      const data = change.doc.data();
      if(mergeEntityChange(change, data.dateStr, data.shift, sh=>sh.sales)) changedAny = true;
    });
    if(changedAny){ saveData(); render(); }
  }, ()=>{});

  onSnapshot(collection(db, COL_TX), (snapshot)=>{
    let changedAny = false;
    snapshot.docChanges().forEach(change=>{
      const data = change.doc.data();
      if(mergeEntityChange(change, data.dateStr, data.shift, sh=>sh.transactions)) changedAny = true;
    });
    if(changedAny){ saveData(); render(); }
  }, ()=>{});
}
